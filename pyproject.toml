[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-learning"
version = "0.1.0"
description = "Local Retrieval-Augmented Generation learning project with provider switching between Ollama and LM Studio."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Viorel Dumbrava" }]
license = { text = "MIT" }
dependencies = [
    "chromadb>=0.5.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pypdf>=4.0",
    "cryptography>=3.1",
    "rich>=13.7",
    "typer>=0.12",
    "openai>=1.30",
    "PySide6>=6.7",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rag-app = "rag_app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_app = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
