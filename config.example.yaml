# local-rag-learning configuration file.
#
# Copy this file to `config.yaml` and edit values for your environment.
# Two example provider setups are shown below — uncomment the one you want
# to use. The defaults below are configured for LM Studio.
#
# IMPORTANT:
#   The same embedding model MUST be used for ingestion and query, because
#   embeddings from different models are not comparable. If you change the
#   embedding model, clear the vector store and re-ingest the documents.

app:
  name: "local-rag-learning"
  debug: false

paths:
  documents_dir: "documents"
  storage_dir: "storage"
  chroma_dir: "storage/chroma"
  qdrant_dir: "storage/qdrant"   # embedded-Qdrant data dir (when provider: qdrant)
  index_file: "storage/document_index.json"

chunking:
  chunk_size: 900       # characters per chunk
  chunk_overlap: 150    # characters of overlap between neighboring chunks
  # Strategy used to split documents:
  #   paragraph - split on blank lines, pack into chunks (good general default)
  #   heading   - split on section headings (good for datasheets / structured docs)
  #   semantic  - recursive: headings -> paragraphs -> sentences (highest quality)
  strategy: "paragraph"
  # Contextual retrieval (Anthropic-style): at ingest, ask the chat model to
  # write 1-2 sentences situating each chunk in its document and prepend that
  # before embedding. Improves retrieval of context-dependent chunks.
  #   COST: ~1 chat LLM call PER CHUNK at ingest. A 100-chunk doc at ~3 s/call
  #   is ~5 minutes with a local model. Queries are unaffected.
  #   Changing this requires a re-ingest (the chunking fingerprint handles it
  #   automatically; `ingest --force` also works).
  contextual: false
  contextual_document_chars: 6000   # document truncated to this before the LLM sees it

# ---------------------------------------------------------------------------
# Default provider setup: LM Studio for both chat and embeddings.
# Start LM Studio, load a chat model and an embedding model, then enable the
# "Local Server" tab. The server is OpenAI-compatible.
# ---------------------------------------------------------------------------
chat:
  provider: "lmstudio"            # ollama | lmstudio
  model: "google/gemma-4-e4b"            # whatever model id LM Studio shows
  base_url: "http://192.168.50.84:1234/v1"
  temperature: 0.2
  max_tokens: 800

embeddings:
  provider: "lmstudio"            # ollama | lmstudio
  model: "text-embedding-nomic-embed-text-v1.5"   # whatever embedding model id LM Studio shows
  base_url: "http://192.168.50.84:1234/v1"

# ---------------------------------------------------------------------------
# Alternative: Ollama for both chat and embeddings.
# Start Ollama (`ollama serve`), pull a chat model and an embedding model:
#     ollama pull gemma3:12b
#     ollama pull embeddinggemma
#
# chat:
#   provider: "ollama"
#   model: "gemma3:12b"
#   base_url: "http://192.168.50.84:11434"
#   temperature: 0.2
#   max_tokens: 800
#
# embeddings:
#   provider: "ollama"
#   model: "embeddinggemma"
#   base_url: "http://localhost:11434"
# ---------------------------------------------------------------------------

vector_store:
  provider: "chroma"            # chroma | qdrant
  collection_name: "local_rag_docs"
  # Qdrant alternative (needs the optional extra: pip install -e .[qdrant]).
  # Switching backends is a separate index — clear + re-ingest after changing.
  #   provider: "qdrant"
  #   qdrant_url: "http://localhost:6333"   # omit for embedded (paths.qdrant_dir)
  qdrant_url: null

retrieval:
  top_k: 5
  # Candidate pool used by MMR/rerankers before final top_k. null = auto
  # (top_k * 4 when MMR or a reranker is enabled).
  candidate_k: null
  score_threshold: null     # set a float to discard chunks above this distance
  # Hybrid search: combine dense vector retrieval with BM25 keyword search,
  # merge results with Reciprocal Rank Fusion. Fixes the "rare-token miss"
  # failure mode of pure vector search (error codes, identifiers, names).
  hybrid: false
  # BM25's share of the RRF merge: BM25 contributions are multiplied by this
  # weight, vector contributions by (1 - weight). 0.5 treats both equally.
  hybrid_keyword_weight: 0.3
  # HyDE: ask the LLM to write a hypothetical answer, embed THAT, then search.
  # Often improves recall for vague or natural-language questions. Adds one
  # extra LLM call per query.
  use_hyde: false
  # Query decomposition: split compound questions into focused sub-questions,
  # search each one, then merge with RRF. Adds one LLM call per query.
  query_decomposition: false
  query_decomposition_max_subquestions: 3
  # MMR: select final chunks by balancing query relevance against diversity.
  # Lower lambda = more diversity; higher lambda = more pure relevance.
  use_mmr: false
  mmr_lambda: 0.5
  # Reranker: re-score the top retrieved chunks by asking the chat model to
  # rate each one's relevance (0-10), or by running a local sentence-transformers
  # CrossEncoder when reranker_backend is "sentence-transformers".
  # Set reranker_model to any non-empty string to enable.
  reranker_model: null
  reranker_backend: "llm"   # llm | sentence-transformers
  # Multi-query: ask the LLM for N alternative phrasings of the question,
  # search with each one, and merge all result lists with RRF. Catches
  # vocabulary-mismatch misses (you say "speed", the doc says "baud rate").
  # Adds one LLM call + N extra embedding/search rounds per query. 0 = off.
  multi_query: 0
  # Neighbor expansion: after ranking, stitch the ±N adjacent chunks of each
  # hit into its text so the LLM sees the surrounding context (the chunk
  # before and after usually finish the sentence/table the hit started).
  # No extra LLM calls — the prompt just gets wider. 0 = off.
  neighbor_radius: 0
  # Multi-hop / iterative retrieval: after the first retrieval, show the LLM
  # what was found and let it issue a follow-up search query for whatever is
  # still missing, then merge the hops with RRF. Good for questions whose
  # answer is spread across chunks that don't co-occur. Each hop costs +1 LLM
  # call + 1 retrieval round; it stops early on a NONE reply, a repeated
  # query, or a hop that finds nothing new. false = off.
  multi_hop: false
  multi_hop_max_hops: 2   # additional retrieval rounds beyond the first (1-5)

prompt:
  answer_only_from_context: true
  include_sources: true
  max_history_turns: 10    # retain at most 10 complete user/assistant pairs
  max_prompt_chars: 24000  # character guard; not an exact model token count

# ---------------------------------------------------------------------------
# OCR — optional, off by default.
# Enable this to ingest scanned PDFs (image-only pages) and image files
# (PNG, JPEG, TIFF, BMP, WebP).
#
# Requirements:
#   pip install pdf2image pytesseract Pillow
#   • Windows: install Tesseract from https://github.com/UB-Mannheim/tesseract/wiki
#              and add it to PATH (or set pytesseract.pytesseract.tesseract_cmd).
#   • Linux:   sudo apt install tesseract-ocr
#   • macOS:   brew install tesseract
#
# Performance note:
#   OCR only runs at INGEST time (never during queries).  It is skipped for
#   pages/files that already have enough text (>= min_chars_per_page).
# ---------------------------------------------------------------------------
ocr:
  enabled: false
  min_chars_per_page: 50   # pages with fewer chars trigger OCR fallback
  lang: "eng"              # Tesseract language code(s), e.g. "eng+deu"

# ---------------------------------------------------------------------------
# Caching — optional, off by default. In-memory only (a restart clears them).
#   embedding: cache hash(query) -> vector, so a repeated question skips
#              re-embedding. Keyed on the embedding model (change model = miss).
#   answer: exact ordered prompt + provider endpoint/model + generation settings.
#           Includes evidence text and order. Bypassed for multi-turn and streaming.
# ---------------------------------------------------------------------------
cache:
  embedding: false
  answer: false
  max_entries: 1024        # LRU cap per cache

# Observability: emit one structured log line per query with per-stage timings.
# Timings are always collected and shown in `query --debug` regardless; this
# only controls the log line (needs app.debug or a configured log level).
observability:
  log_timings: false

server:
  # Used by `rag-app serve` (FastAPI REST API).
  # Inside Docker use host "0.0.0.0" (see config.docker.yaml) — 127.0.0.1
  # is not reachable through the container's port mapping.
  host: "127.0.0.1"
  port: 8000
  allowed_document_roots: [] # additional web ingestion roots; documents_dir is always allowed
  upload_max_bytes: 26214400 # 25 MiB per file
  upload_max_files: 20
