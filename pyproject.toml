[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-learning"
version = "0.1.0"
description = "Local Retrieval-Augmented Generation learning project with provider switching between Ollama and LM Studio."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Viorel Dumbrava" }]
license = { text = "MIT" }
dependencies = [
    "chromadb>=0.5.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pypdf>=4.0",
    "cryptography>=3.1",
    "rich>=13.7",
    "typer>=0.12",
    "openai>=1.30",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "filelock>=3.13",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
browser = [
    "playwright>=1.45",
]
gui = [
    "PySide6>=6.7",
]
reranker = [
    "sentence-transformers>=3.0",
]
qdrant = [
    "qdrant-client>=1.9",
]
# Optional framework learning track (examples/ only — the core stays
# framework-free). See docs/05_FRAMEWORKS.md.
langchain = [
    "langchain-core>=0.3",
    "langchain-chroma>=0.1",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
]
llamaindex = [
    "llama-index-core>=0.11",
    "llama-index-llms-ollama>=0.3",
    "llama-index-embeddings-ollama>=0.3",
    "llama-index-vector-stores-chroma>=0.2",
    "llama-index-llms-openai-like>=0.2",
    "llama-index-embeddings-openai-like>=0.1",
]

[project.scripts]
rag-app = "rag_app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_app = ["webui/*", "eval/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
