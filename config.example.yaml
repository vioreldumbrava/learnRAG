# local-rag-learning configuration file.
#
# Copy this file to `config.yaml` and edit values for your environment.
# Two example provider setups are shown below — uncomment the one you want
# to use. The defaults below are configured for LM Studio.
#
# IMPORTANT:
#   The same embedding model MUST be used for ingestion and query, because
#   embeddings from different models are not comparable. If you change the
#   embedding model, clear the vector store and re-ingest the documents.

app:
  name: "local-rag-learning"
  debug: false

paths:
  documents_dir: "documents"
  storage_dir: "storage"
  chroma_dir: "storage/chroma"
  index_file: "storage/document_index.json"

chunking:
  chunk_size: 900       # characters per chunk
  chunk_overlap: 150    # characters of overlap between neighboring chunks
  # Strategy used to split documents:
  #   paragraph - split on blank lines, pack into chunks (good general default)
  #   heading   - split on section headings (good for datasheets / structured docs)
  #   semantic  - recursive: headings -> paragraphs -> sentences (highest quality)
  strategy: "paragraph"

# ---------------------------------------------------------------------------
# Default provider setup: LM Studio for both chat and embeddings.
# Start LM Studio, load a chat model and an embedding model, then enable the
# "Local Server" tab. The server is OpenAI-compatible.
# ---------------------------------------------------------------------------
chat:
  provider: "lmstudio"            # ollama | lmstudio
  model: "google/gemma-4-e4b"            # whatever model id LM Studio shows
  base_url: "http://192.168.50.84:1234/v1"
  temperature: 0.2
  max_tokens: 800

embeddings:
  provider: "lmstudio"            # ollama | lmstudio
  model: "text-embedding-nomic-embed-text-v1.5"   # whatever embedding model id LM Studio shows
  base_url: "http://192.168.50.84:1234/v1"

# ---------------------------------------------------------------------------
# Alternative: Ollama for both chat and embeddings.
# Start Ollama (`ollama serve`), pull a chat model and an embedding model:
#     ollama pull gemma3:12b
#     ollama pull embeddinggemma
#
# chat:
#   provider: "ollama"
#   model: "gemma3:12b"
#   base_url: "http://192.168.50.84:11434"
#   temperature: 0.2
#   max_tokens: 800
#
# embeddings:
#   provider: "ollama"
#   model: "embeddinggemma"
#   base_url: "http://localhost:11434"
# ---------------------------------------------------------------------------

vector_store:
  provider: "chroma"
  collection_name: "local_rag_docs"

retrieval:
  top_k: 5
  score_threshold: null     # set a float to discard chunks above this distance
  # Hybrid search: combine dense vector retrieval with BM25 keyword search,
  # merge results with Reciprocal Rank Fusion. Fixes the "rare-token miss"
  # failure mode of pure vector search (error codes, identifiers, names).
  hybrid: false
  hybrid_keyword_weight: 0.3
  # HyDE: ask the LLM to write a hypothetical answer, embed THAT, then search.
  # Often improves recall for vague or natural-language questions. Adds one
  # extra LLM call per query.
  use_hyde: false
  # Reranker: re-score the top retrieved chunks by asking the chat model to
  # rate each one's relevance (0-10). Slower but much more accurate top-k.
  # Set to any non-empty string to enable (the value is informational).
  reranker_model: null

prompt:
  answer_only_from_context: true
  include_sources: true

# ---------------------------------------------------------------------------
# OCR — optional, off by default.
# Enable this to ingest scanned PDFs (image-only pages) and image files
# (PNG, JPEG, TIFF, BMP, WebP).
#
# Requirements:
#   pip install pdf2image pytesseract Pillow
#   • Windows: install Tesseract from https://github.com/UB-Mannheim/tesseract/wiki
#              and add it to PATH (or set pytesseract.pytesseract.tesseract_cmd).
#   • Linux:   sudo apt install tesseract-ocr
#   • macOS:   brew install tesseract
#
# Performance note:
#   OCR only runs at INGEST time (never during queries).  It is skipped for
#   pages/files that already have enough text (>= min_chars_per_page).
# ---------------------------------------------------------------------------
ocr:
  enabled: false
  min_chars_per_page: 50   # pages with fewer chars trigger OCR fallback
  lang: "eng"              # Tesseract language code(s), e.g. "eng+deu"

server:
  # Used by `rag-app serve` (FastAPI REST API).
  host: "127.0.0.1"
  port: 8000
