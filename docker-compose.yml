# Run the RAG REST API in Docker.
#
#   docker compose up --build -d          # API only (model servers elsewhere)
#   docker compose --profile ollama up -d # also start a bundled Ollama
#
# Edit config.docker.yaml to point chat/embeddings at your model servers
# (host.docker.internal for the Docker host, a LAN IP, or http://ollama:11434
# for the bundled service), then restart the container.
#
# NOTE: ./storage is shared with the host CLI/GUI. Chroma is a SQLite-backed
# store — don't run the container and a host-side `rag-app` against the same
# storage/ at the same time.

services:
  rag-api:
    build: .
    image: rag-api
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./documents:/app/documents
      - ./config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional self-contained model server. Off by default; enable with
  # `--profile ollama`. Pull models once with:
  #   docker compose exec ollama ollama pull gemma3:12b
  #   docker compose exec ollama ollama pull embeddinggemma
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-models:
